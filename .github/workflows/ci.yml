name: Frontend CI

on:
  push:
    branches: [main, feature/premium-relocation-ui]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture lint report
        run: npm run lint -- --format json > lint-report.json || true
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
